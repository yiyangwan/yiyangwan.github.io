# Signature events for /around-seattle/: the annual festivals, celebrations, and holiday traditions worth planning
# around. These are public factual claims. Every date range names the official page that states it (source) and the
# day it was checked (verified). The page lists only dated entries, so an entry without upcoming dates shows nothing,
# and the build log names it ("needs its next dates") so its next dates can be added once they are announced.
#
# Fields: id, title, summary (one neutral sentence on what happens there), place, city, region (seattle or eastside),
# category (festival, music, market, outdoors, arts), url (official page), free (true, false, or omitted when it
# varies or the official page does not say), usually (when it normally happens), match (optional feed titles for the
# same event), and dates. Each date range has from and to (inclusive) and may have starts and ends, quoted "HH:MM"
# times on the first and last day; without them, the event is listed as all day.

